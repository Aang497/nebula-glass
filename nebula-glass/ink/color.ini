; Ink — black smoked glass over the monochrome manga wallpaper.
; card uses #AARRGGBB (80 = 50% opacity), which Spicetify Android reads as translucent.
; Desktop Spicetify can't read the alpha; user.css restores the right card colour there.

[Ink]
text               = FFFFFF
subtext            = C8C8C8
main               = 0A0A0A
main-elevated      = 161616
sidebar            = 0A0A0A
player             = 0A0A0A
card               = #80000000
shadow             = 000000
selected-row       = FFFFFF
button             = FFFFFF
button-active      = D4D4D4
button-disabled    = 4A4A4A
tab-active         = 262626
notification       = 3A3A3A
notification-error = E5484D
misc               = 4A4A4A
highlight          = 262626
highlight-elevated = 303030
play-button        = FFFFFF
nav-active         = FFFFFF
